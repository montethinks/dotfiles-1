# -----------------------------
# tmux config for Ghostty + Neovim + agent CLI
# -----------------------------

# Reload config quickly
bind-key f5 source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Use a modern TERM *inside* tmux.
# Ghostty itself uses xterm-ghostty outside tmux; tmux should advertise its own terminfo.
set -g default-terminal "tmux-256color"

# Enable truecolor when the outer terminal is Ghostty (or other modern terminals).
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"

# Sensible shell + responsiveness
set-option -g default-shell "$SHELL"
set -sg escape-time 10
set -g history-limit 100000

# Start windows/panes in the current directory
bind-key _ split-window -v -c "#{pane_current_path}"
bind-key | split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Vim-style copy mode
setw -g mode-keys vi

# Pane navigation (Alt + hjkl)
bind-key -n M-h select-pane -L
bind-key -n M-j select-pane -D
bind-key -n M-k select-pane -U
bind-key -n M-l select-pane -R

# Pane resizing (Prefix + Shift + hjkl)
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Optional: window navigation with Ctrl-h / Ctrl-l
bind-key -r C-h previous-window
bind-key -r C-l next-window

# Scroll wheel behavior that feels sane in Ghostty:
# - if the app in the pane handles the mouse (nvim, less with mouse, etc.), pass it through
# - otherwise, scrolling up enters copy mode automatically
# - scrolling in copy mode scrolls the tmux history
bind-key -n WheelUpPane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' \
  'if-shell -F "#{pane_in_mode}" "send-keys -X scroll-up" "copy-mode -e; send-keys -X scroll-up"'

bind-key -n WheelDownPane if-shell -F '#{mouse_any_flag}' \
  'send-keys -M' \
  'if-shell -F "#{pane_in_mode}" "send-keys -X scroll-down" "send-keys -M"'

bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down

# Easier copy-mode entry
bind-key [ copy-mode

# Clipboard: use pbcopy directly on modern macOS
bind-key y run-shell 'tmux save-buffer - | pbcopy; tmux display-message "Copied tmux buffer to clipboard"'

# Visuals
set-option -g pane-border-style fg=colour235
set-option -g pane-active-border-style fg=colour240
set-option -g status-style bg=colour235,fg=colour136
set-window-option -g window-status-style fg=colour244
set-window-option -g window-status-current-style fg=colour166
set-option -g message-style bg=colour235,fg=colour166
set-option -g display-panes-active-colour colour33
set-option -g display-panes-colour colour166
set-window-option -g clock-mode-colour colour64

# Helpful quality-of-life defaults
set -g renumber-windows on
set -g set-clipboard on
set -g focus-events on

# Keep current-path when splitting from command prompt too
unbind '"'
unbind %
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
